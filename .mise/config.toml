[tasks.update]
description = "Update flake inputs and GitHub packages"
run = [
  "sudo nix flake update",
  "./scripts/update-github-packages.sh",
  "nix flake check --no-build",
]

[tasks.rebuild]
description = "Apply nix-darwin configuration"
run = "sudo darwin-rebuild switch --impure --flake path:.#${USER}-aarch64-darwin --override-input user-config path:${HOME}/.config/nix"
depends_post = ["post-rebuild-agent-browser"]

[tasks.brew-cleanup]
description = "Clean up Homebrew"
run = "brew cleanup"

[tasks.post-rebuild-agent-browser]
hide = true
description = "Install agent-browser"
run = "agent-browser install"

[tasks."mise:install-global"]
description = "Install globally configured mise tools"
run = "mise install -C ${HOME}"
