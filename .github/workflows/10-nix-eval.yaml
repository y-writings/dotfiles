name: "[10] Nix evaluation"
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nix-evaluation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  nix-eval:
    name: nix-eval
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
      - name: Evaluate public flake outputs
        run: |
          docker run --rm \
            --volume "${GITHUB_WORKSPACE}:/workspace:ro" \
            --workdir /workspace \
            docker.io/nixos/nix:2.35.1@sha256:377d4887aca98f0dfa12971c1ea6d6a625a435d8b610d4c95a436843da6fbfd1 \
            nix --extra-experimental-features "nix-command flakes" \
              flake check path:/workspace \
              --all-systems \
              --no-build \
              --no-update-lock-file \
              --keep-going
